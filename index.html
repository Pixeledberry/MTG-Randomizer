<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MTG Randomizer</title>
<meta name="description" content="Roll a random Magic: The Gathering card from your own filtered pool. Powered by the Scryfall API.">
<meta name="theme-color" content="#0f5132">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230f5132'/%3E%3Crect x='14' y='14' width='36' height='36' rx='8' fill='%23fff'/%3E%3Cg fill='%230f5132'%3E%3Ccircle cx='24' cy='24' r='4.5'/%3E%3Ccircle cx='40' cy='24' r='4.5'/%3E%3Ccircle cx='32' cy='32' r='4.5'/%3E%3Ccircle cx='24' cy='40' r='4.5'/%3E%3Ccircle cx='40' cy='40' r='4.5'/%3E%3C/g%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
  *{box-sizing:border-box}
  :root{
    --bg:#f2f5f3; --panel:#ffffff; --ink:#1c2521; --sub:#5c6d64; --line:#d9e2dc;
    --accent:#0f5132; --accent-ink:#ffffff; --chip:#e5efe8; --chip-ink:#2a3a31;
    --chip-on-bg:#0f5132; --chip-on-ink:#ffffff; --danger:#b23b2e; --card-bg:#ffffff;
    --border:#d9e2dc; --muted:#5c6d64; --panel2:#f2f5f3;
  }
  [data-theme="dark"]{
    --bg:#0f1413; --panel:#171e1b; --ink:#e6ede8; --sub:#8fa097; --line:#2b3531;
    --accent:#0f5132; --accent-ink:#ffffff; --chip:#232d28; --chip-ink:#c7d4cc;
    --chip-on-bg:#2e9e63; --chip-on-ink:#ffffff; --danger:#e07a6d; --card-bg:#1e2622;
    --border:#2b3531; --muted:#8fa097; --panel2:#1e2622;
  }
  html,body{margin:0;padding:0}
  body{
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    background:var(--bg); color:var(--ink); line-height:1.45;
  }
  header{
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 18px; background:var(--accent); color:#fff;
    position:sticky; top:0; z-index:5;
  }
  header h1{font-size:1.15rem;margin:0;letter-spacing:.02em}
  .icon-btn{
    border:0;background:rgba(255,255,255,.16);color:#fff;font-size:1rem;
    padding:6px 10px;border-radius:999px;cursor:pointer;
  }
  main{max-width:720px;margin:0 auto;padding:16px 14px 32px}
  .panel{
    background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:16px;margin-bottom:16px;
  }
  h2{
    font-size:.95rem;text-transform:uppercase;letter-spacing:.08em;color:var(--sub);
    margin:0 0 12px;display:flex;align-items:center;justify-content:space-between;gap:10px;
  }
  label.fld{display:block;font-size:.85rem;font-weight:600;margin:12px 0 6px}
  input[type="text"],input[type="number"],select{
    width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;
    background:var(--bg);color:var(--ink);font:inherit;
  }
  input:focus,select:focus{outline:2px solid var(--accent);outline-offset:1px}
  .row{display:flex;gap:10px}
  .row>div{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
  .chip{
    border:1px solid var(--line);background:var(--chip);color:var(--chip-ink);
    padding:7px 12px;border-radius:999px;font:inherit;font-size:.88rem;cursor:pointer;
  }
  .chip.on{background:var(--chip-on-bg);color:var(--chip-on-ink);border-color:transparent;font-weight:600}
  .grp{margin-top:16px}
  .grp-label{font-size:.8rem;font-weight:700;color:var(--sub);text-transform:uppercase;letter-spacing:.06em}
  .btn{
    width:100%;margin-top:20px;padding:14px;border:0;border-radius:12px;
    background:var(--accent);color:var(--accent-ink);font:inherit;font-size:1.05rem;font-weight:700;
    cursor:pointer;letter-spacing:.02em;
  }
  .btn:disabled{opacity:.6;cursor:wait}
  .q-preview{
    font-size:.78rem;color:var(--sub);margin:12px 0 0;
    font-family:ui-monospace,Consolas,monospace;word-break:break-word;
  }
  .q-preview.empty{display:none}
  .error{
    display:none;margin:0 0 16px;padding:12px 14px;border-radius:10px;
    background:var(--panel);color:var(--danger);border:1px solid var(--line);
    font-size:.9rem;white-space:pre-wrap;
  }
  .error.show{display:block}
  .result{animation:pop .18s ease-out}
  @keyframes pop{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
  .result-head{display:flex;gap:14px;align-items:flex-start}
  .result img{
    width:110px;height:auto;border-radius:10px;border:1px solid var(--line);
    background:var(--card-bg);flex:0 0 auto;
  }
  .rname{font-size:1.3rem;font-weight:800;margin:0 0 4px}
  .rmana{font-size:1rem;color:var(--sub);font-weight:600;margin:0 0 6px}
  .rtype{font-style:italic;color:var(--sub);margin:0;font-size:.92rem}
  .rtext{
    background:var(--bg);border:1px solid var(--line);border-radius:10px;
    padding:12px;font-size:.95rem;margin:14px 0 10px;white-space:pre-wrap;
  }
  .rmeta{font-size:.82rem;color:var(--sub);margin:0 0 12px}
  .result-actions{display:flex;gap:10px;flex-wrap:wrap}
  .action{
    border:1px solid var(--line);background:var(--chip);color:var(--chip-ink);
    padding:9px 14px;border-radius:10px;font:inherit;font-size:.9rem;font-weight:600;
    cursor:pointer;text-decoration:none;display:inline-block;
  }
  ol.hist{margin:0;padding:0;list-style:none}
  .hist-item{
    list-style:none;margin:0 0 8px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;
    display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--bg);
  }
  .hist-name{font-weight:600;text-decoration:none;color:var(--ink);word-break:break-word}
  .hist-name:hover{text-decoration:underline}
  .hist-time{font-size:.75rem;color:var(--sub);white-space:nowrap}
  .hist-empty{color:var(--sub);font-size:.88rem;margin:0}
  footer{text-align:center;font-size:.78rem;color:var(--sub);padding:0 16px 28px}
  footer a{color:var(--sub)}
  @media (max-width:480px){
    .result img{width:88px}
    .rname{font-size:1.15rem}
  }
  .hist li img{width:34px;height:48px;object-fit:cover;border-radius:4px;flex-shrink:0}
/* result card */
.cardArt { display: block; width: 100%; max-height: 440px; object-fit: contain; background: #efece4; border-radius: 12px 12px 0 0; }
.cardBody { padding: 14px 16px 16px; }
.cardBody h2 { margin: 0 0 8px; font-size: 1.2rem; line-height: 1.25; }
.cardMeta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 10px; font-size: 0.82rem; color: var(--muted); }
.badge { display: inline-block; background: var(--border); color: var(--ink); padding: 1px 9px; border-radius: 99px; font-weight: 600; font-size: 0.78rem; }
.badge.cmc { background: #7a1f1f; color: #fff; }
.cardText { margin: 0 0 12px; line-height: 1.5; font-size: 0.95rem; white-space: pre-line; }
.cardActions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: flex-end; }
.cardActions .reRoll { margin-top: 0; align-self: auto; }
/* history list with thumbnails */
#historyList { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
#historyList li { display: flex; align-items: center; gap: 10px; background: var(--panel2); border: 1px solid var(--border); border-radius: 10px; padding: 6px 8px; }
#historyList li img { width: 36px; height: 50px; object-fit: cover; border-radius: 5px; border: 1px solid var(--border); flex: none; }
#historyList li span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 0.9rem; }
#historyList li button.rm { flex: none; width: 26px; height: 26px; border-radius: 8px; border: 1px solid var(--border); background: transparent; color: var(--muted); cursor: pointer; font-size: 0.8rem; }
#historyList li button.rm:hover { color: #b3423a; border-color: #b3423a; }
</style>
</head>
<body>
<header>
  <h1>&#9855; MTG Randomizer</h1>
  <button class="icon-btn" id="themeBtn" title="Toggle light/dark theme" aria-label="Toggle theme">&#127769;</button>
</header>
<main>
  <section class="panel" aria-label="Card pool filters">
    <h2>Build your pool</h2>
    <div class="chips" id="colorChips" role="group" aria-label="Color identity">
      <button class="chip" data-color="W">W</button>
      <button class="chip" data-color="U">U</button>
      <button class="chip" data-color="B">B</button>
      <button class="chip" data-color="R">R</button>
      <button class="chip" data-color="G">G</button>
    </div>

    <div class="row">
      <div>
        <label class="fld" for="raritySel">Rarity</label>
        <select id="raritySel">
          <option value="">Any</option>
          <option value="common">Common</option>
          <option value="uncommon">Uncommon</option>
          <option value="rare">Rare</option>
          <option value="mythic">Mythic</option>
        </select>
      </div>
      <div>
        <label class="fld" for="cmcInput">Converted mana cost</label>
        <input type="number" id="cmcInput" inputmode="numeric" min="0" max="20" placeholder="Any (e.g. 3)">
      </div>
    </div>

    <div class="row">
      <div>
        <label class="fld" for="legalSet">Legal in set</label>
        <select id="legalSet"><option value="">Any set</option></select>
      </div>
      <div>
        <label class="fld" for="notSet">Exclude set</label>
        <select id="notSet"><option value="">None</option></select>
      </div>
    </div>

    <div class="grp">
      <span class="grp-label">Content</span>
      <div class="chips" id="contentChips" role="group" aria-label="Content filters">
        <button class="chip" data-content="creature">Creatures</button>
        <button class="chip" data-content="artifacts">Artifacts</button>
        <button class="chip" data-content="enchantments">Enchantments</button>
        <button class="chip" data-content="creature-types">Creature types</button>
      </div>
    </div>

    <div class="grp">
      <span class="grp-label">Exclusions</span>
      <div class="chips" id="excludeChips" role="group" aria-label="Exclusions">
        <button class="chip" data-exclude="sagas">Exclude sagas</button>
        <button class="chip" data-exclude="tokens">Exclude tokens</button>
        <button class="chip" data-exclude="conventions">Exclude conventions</button>
      </div>
    </div>

    <label class="fld" for="freeText">Free-text query (Scryfall syntax)</label>
    <input type="text" id="freeText" placeholder='e.g. name~"storm" is:split' spellcheck="false">

    <button class="btn" id="rollBtn">&#127922; Roll a card</button>
    <p class="q-preview empty" id="queryPreview"></p>
  </section>

  <div class="error" id="errorBox" role="alert"></div>

  <section class="panel result" id="resultPanel" hidden aria-live="polite">
    <h2>Result <span id="poolInfo" style="text-transform:none;letter-spacing:0;font-weight:500"></span></h2>
    <div class="result-head">
      <img id="cArt" alt="">
      <div>
        <h3 class="rname" id="cName"></h3>
        <p class="rmana" id="cMana"></p>
        <p class="rtype" id="cType"></p>
      </div>
    </div>
    <div class="rtext" id="cText"></div>
    <p class="rmeta" id="cMeta"></p>
    <div class="result-actions">
      <a class="action" id="cLink" target="_blank" rel="noopener">Open on Scryfall</a>
      <button class="action" id="reRollBtn">Roll another</button>
    </div>
  </section>

  <section class="panel" aria-label="Roll history">
    <h2>History <button class="action" id="clearHist" style="margin-top:-18px;padding:4px 10px">Clear</button></h2>
    <ul id="historyList"></ul>
    <p class="hist-empty" id="histEmpty" hidden>No rolls yet. Build a pool and roll!</p>
  </section>
</main>
<footer>
  Card data courtesy of <a href="https://scryfall.com" target="_blank" rel="noopener">Scryfall</a>.
  This is not affiliated with or endorsed by Wizards of the Coast.
</footer>
<!--SCRIPT_ANCHOR-->
<script>
"use strict";
const API = "https://api.scryfall.com";
const $ = (id) => document.getElementById(id);

/* ---------- theme ---------- */
const THEME_KEY = "mtgr-theme";
function applyTheme(name) {
  const dark = name === "dark" ||
    (!name && window.matchMedia("(prefers-color-scheme: dark)").matches);
  document.documentElement.classList.toggle("dark", dark);
  $("themeBtn").textContent = dark ? "\u2600\uFE0F" : "\u263E";
}
applyTheme(localStorage.getItem(THEME_KEY));
$("themeBtn").addEventListener("click", () => {
  const next = document.documentElement.classList.contains("dark") ? "light" : "dark";
  try { localStorage.setItem(THEME_KEY, next); } catch (e) { /* storage unavailable */ }
  applyTheme(next);
});

/* ---------- set dropdowns ---------- */
async function loadSets() {
  const sels = [$("legalSet"), $("notSet")];
  for (const sel of sels) sel.innerHTML = '<option value="">(any)</option>';
  try {
    const res = await fetch(API + "/sets?order=release_date&unique=expansion");
    const data = await res.json();
    const sets = (data.data || []).slice().reverse();
    const opts = sets.map(s =>
      '<option value="' + s.code + '">' +
      s.name.replace(/"/g, "&quot;") + "</option>").join("");
    for (const sel of sels) sel.insertAdjacentHTML("beforeend", opts);
  } catch (e) {
    console.warn("Could not load sets:", e);
  }
}
loadSets();

/* ---------- chip groups ---------- */
function wireChips(groupId) {
  const box = $(groupId);
  box.addEventListener("click", (e) => {
    const btn = e.target.closest("button.chip");
    if (!btn) return;
    btn.classList.toggle("on");
    updatePreview();
  });
  return () => Array.from(box.querySelectorAll("button.on")).map(b =>
    b.getAttribute(groupId === "colorChips" ? "data-color"
      : groupId === "contentChips" ? "data-content"
      : "data-exclude"));
}
const selColors = wireChips("colorChips");
const selContent = wireChips("contentChips");
const selExclude = wireChips("excludeChips");

/* ---------- Scryfall query ---------- */
function buildQuery() {
  const q = [];
  const allColors = selColors();
  const letters = allColors.filter(c => /^[WUBRG]$/.test(c));
  if (letters.length) q.push("colors=" + letters.join(""));
  if (allColors.includes("colorless")) q.push("colorless");
  const content = selContent();
  if (content.includes("creature")) q.push("is:creature");
  if (content.includes("artifacts")) q.push("is:artifact");
  if (content.includes("enchantments")) q.push("is:enchantment");
  if (content.includes("creature-types")) q.push("is:legendary");
  const excluded = selExclude();
  if (excluded.includes("sagas")) q.push("-is:saga");
  if (excluded.includes("tokens")) q.push("is:token=false");
  if (excluded.includes("conventions")) q.push("-is:convention");
  const rar = $("raritySel").value;
  if (rar) q.push("rarity:" + rar);
  const cmc = ($("cmcInput").value || "").replace(/\D/g, "");
  if (cmc) q.push("cmc=" + cmc);
  const legal = $("legalSet").value;
  if (legal) q.push("set:" + legal);
  const not = $("notSet").value;
  if (not) q.push("-set:" + not);
  const free = $("freeText").value.trim();
  if (free) q.push(free);
  if (!q.length) q.push("is:legal");
  return q.join(" ");
}

function updatePreview() {
  $("queryPreview").textContent = buildQuery();
}
/* ---------- rolling ---------- */
const PAGE_SIZE = 250;    /* Scryfall maximum page size */
const OFFSET_CAP = 1800;  /* Scryfall maximum offset */
let busy = false;

async function fetchJson(url, statusPanel) {
  let res = await fetch(url);
  if (res.status === 429) {
    const secs = parseInt(res.headers.get("Retry-After"), 10) || 5;
    if (statusPanel) statusPanel.innerHTML =
      "Rate limited &mdash; retrying in " + secs + "s\u2026";
    await new Promise(r => setTimeout(r, secs * 1000 + 300));
    res = await fetch(url);
  }
  if (!res.ok) throw new Error("Scryfall responded " + res.status);
  return res.json();
}

async function roll() {
  if (busy) return;
  busy = true;
  $("rollBtn").disabled = true;
  const panel = $("resultPanel");
  panel.className = "card status";
  panel.innerHTML = '<div class="spinner"></div>Rolling\u2026';
  try {
    const q = encodeURIComponent(buildQuery());
    let card = null;
    try {
      /* Preferred: Scryfall's own random-card endpoint (uniform over the full pool) */
      card = await fetchJson(API + "/cards/random?query=" + q, panel);
    } catch (firstErr) {
      /* Fallback: random page of 250 cards, then a random card from that page.
         (offset is capped at 1800 by the API, so pages, not raw offsets) */
      const meta = await fetchJson(API + "/cards?query=" + q + "&page_size=1", panel);
      const total = meta.total_cards || 0;
      if (!total) throw new Error("no cards match those filters");
      const pages = Math.min(
        Math.ceil(total / PAGE_SIZE),
        Math.floor(OFFSET_CAP / PAGE_SIZE) + 1);
      const offset = Math.floor(Math.random() * pages) * PAGE_SIZE;
      const page = await fetchJson(
        API + "/cards?query=" + q +
        "&page_size=" + PAGE_SIZE + "&offset=" + offset, panel);
      const cards = page.data || [];
      if (!cards.length) throw new Error("no cards match those filters");
      card = cards[Math.floor(Math.random() * cards.length)];
    }
    showResult(card);
    pushHistory(card);
  } catch (e) {
    panel.className = "card status";
    panel.innerHTML = "Could not roll: <b>" + esc(e && e.message ? e.message : e) +
      "</b><br>Check your connection and filters, then try again.";
  } finally {
    busy = false;
    $("rollBtn").disabled = false;
  }
}
$("rollBtn").addEventListener("click", roll);
document.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && e.target === $("freeText")) roll();
});
["raritySel", "cmcInput", "legalSet", "notSet", "freeText"]
  .forEach(id => $(id).addEventListener("input", updatePreview));
updatePreview();
/* ---------- result rendering ---------- */
function esc(v) {
  return String(v == null ? "" : v).replace(/[&<>"']/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
}

function showResult(card) {
  const panel = $("resultPanel");
  panel.className = "card";
  const img = card.image_uris && card.image_uris.png_uri;
  let meta = "";
  if (card.cmc != null) meta += '<span class="badge cmc">' + esc(card.cmc) + "</span>";
  const colors = card.colors || [];
  if (colors.length) meta += '<span class="badge">' + esc(colors.join(" ")) + "</span>";
  else if (card.colorIdentity) meta += '<span class="badge">' + esc(card.colorIdentity) + "</span>";
  if (card.rarity) meta += '<span class="badge">' + esc(card.rarity) + "</span>";
  if (card.type_line) meta += "<span>" + esc(card.type_line) + "</span>";
  const link = "https://scryfall.com/cards/" + encodeURIComponent(card.id || "");
  panel.innerHTML =
    (img ? '<img class="cardArt" src="' + esc(img) + '" alt="' + esc(card.name) + '">' : "") +
    '<div class="cardBody">' +
      "<h2>" + esc(card.name) + "</h2>" +
      (meta ? '<div class="cardMeta">' + meta + "</div>" : "") +
      (card.oracle_text ? '<p class="cardText">' + esc(card.oracle_text) + "</p>" : "") +
      '<div class="cardActions">' +
        '<a class="reRoll" href="' + esc(link) + '" target="_blank" rel="noopener">View on Scryfall</a>' +
        '<button class="reRoll" type="button" id="againBtn">Roll again</button>' +
      "</div>" +
    "</div>";
  $("againBtn").addEventListener("click", roll);
}

/* ---------- history ---------- */
const HISTORY_KEY = "mtgr-history";
const HISTORY_MAX = 10;

function loadHistory() {
  try {
    const list = JSON.parse(localStorage.getItem(HISTORY_KEY));
    return Array.isArray(list) ? list : [];
  } catch (e) {
    return [];
  }
}

function saveHistory(list) {
  list = (list || []).slice(0, HISTORY_MAX);
  try { localStorage.setItem(HISTORY_KEY, JSON.stringify(list)); }
  catch (e) { console.warn("Could not save history:", e); }
  renderHistory();
}

function pushHistory(card) {
  const entry = {
    id: card.id,
    name: card.name,
    img: card.image_uris && card.image_uris.png_uri,
    ts: Date.now()
  };
  saveHistory([entry].concat(loadHistory().filter(h => h.id !== entry.id)));
}

function renderHistory() {
  const ul = $("historyList");
  const list = loadHistory();
  ul.innerHTML = list.map(h =>
    '<li data-id="' + esc(h.id) + '">' +
      (h.img ? '<img src="' + esc(h.img) + '" alt="" loading="lazy">' : "") +
      "<span>" + esc(h.name) + "</span>" +
      '<button class="rm" type="button" title="Remove" aria-label="Remove ' +
        esc(h.name) + '">\u2715</button>' +
    "</li>").join("");
  $("clearHist").disabled = list.length === 0;
}

$("historyList").addEventListener("click", (e) => {
  const btn = e.target.closest("button.rm");
  if (!btn) return;
  const id = btn.closest("li").getAttribute("data-id");
  saveHistory(loadHistory().filter(h => h.id !== id));
});
$("clearHist").addEventListener("click", () => saveHistory([]));
renderHistory();
</script>
</body>
</html>
