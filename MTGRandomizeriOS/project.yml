name: MTGRandomizer
options:
  bundleIdPrefix: com.pixeledberry
  deploymentTarget:
    iOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "2"
targets:
  MTGRandomizer:
    type: application
    platform: iOS
    sources:
      - MTGRandomizer
    info:
      path: MTGRandomizer/Info.plist
      properties:
        CFBundleDisplayName: MTG Randomizer
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pixeledberry.mtgrandomizer
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
