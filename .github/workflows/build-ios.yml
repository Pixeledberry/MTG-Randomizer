name: Build iOS app (unsigned)
on:
  workflow_dispatch:
  push:
    paths:
      - "MTGRandomizeriOS/**"
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy the web app into the iOS project (the main folder is the source of truth)
        run: cp index.html tags.json MTGRandomizeriOS/MTGRandomizer/Resources/
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate the Xcode project
        working-directory: MTGRandomizeriOS
        run: xcodegen generate
      - name: Build (no code signing)
        working-directory: MTGRandomizeriOS
        run: |
          xcodebuild -project MTGRandomizer.xcodeproj -scheme MTGRandomizer -configuration Release \
            -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Package unsigned IPA
        id: pack
        run: |
          VERSION=$(sed -n 's/.*MARKETING_VERSION: "\(.*\)".*/\1/p' MTGRandomizeriOS/project.yml)
          cd MTGRandomizeriOS
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/MTGRandomizer.app Payload/
          zip -qr "../MTGRandomizer-v${VERSION}-unsigned.ipa" Payload
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: mtgrandomizer-ios-ipa
          path: MTGRandomizer-v${{ steps.pack.outputs.version }}-unsigned.ipa
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.pack.outputs.version }}
          name: MTG Randomizer v${{ steps.pack.outputs.version }}
          target_commitish: ${{ github.sha }}
          body: |
            Builds of MTG Randomizer v${{ steps.pack.outputs.version }}.

            - **Android:** download the .apk and open it on your phone (allow "Install unknown apps" when asked). If Android blocks the install, tap **More info**, then **Install anyway**.
            - **Apple:** the .ipa is not signed, so it needs a sideloading tool such as AltStore or Sideloadly. If you can't use one, use the web app.
          files: MTGRandomizer-v${{ steps.pack.outputs.version }}-unsigned.ipa
